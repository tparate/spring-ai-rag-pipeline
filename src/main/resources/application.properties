server.port=8091

spring.application.name=spring-ai-rag-pipeline

# --- Your local PostgreSQL, per the setup you already have running ---
spring.datasource.url=jdbc:postgresql://localhost:5432/demo_rag_db
spring.datasource.username=postgres
# trust auth locally -> password can stay blank
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver


spring.ai.model.chat=ollama
spring.ai.model.embedding=ollama
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.embedding.options.model=nomic-embed-text
spring.ai.ollama.chat.options.model=llama3.2

# lets Spring AI create the vector_store table + extensions on startup
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
# must match the embedding model's output dimension
# text-embedding-3-small = 1536, text-embedding-3-large = 3072
spring.ai.vectorstore.pgvector.dimensions=768

# --- Custom application-level chunking defaults (bound via ChunkingProperties) ---
app.chunking.default-strategy=TOKEN
app.chunking.chunk-size=800
app.chunking.chunk-overlap=100
app.chunking.min-chunk-size-chars=350

logging.level.com.tusharparate.ragpipeline=DEBUG
logging.level.org.springframework.ai=INFO
